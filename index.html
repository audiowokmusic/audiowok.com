<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Wok — Getting things ready for your ears and eyes</title>
  <meta name="description" content="Audio Wok — getting things ready for your ears and eyes.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    main {
      width: min(900px, 100%);
      text-align: center;
    }
    .logo {
      display: block;
      width: min(620px, 88vw);
      height: auto;
      margin: 0 auto 42px;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .contact {
      margin-top: 34px;
      font-size: 16px;
      color: #bbb;
    }
    .contact a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #555;
    }
    .contact a:hover { border-bottom-color: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="audiowok-logo.jpeg" alt="Audio Wok">
    <h1>Getting things ready for your ears and eyes.</h1>
  </main>
</body>
</html>
